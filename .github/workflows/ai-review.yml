name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: AyushShuklaAxeno/gemini-bot@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          openrouter-model: "anthropic/claude-3.5-sonnet, deepseek/deepseek-chat, google/gemini-2.0-flash-001"
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
